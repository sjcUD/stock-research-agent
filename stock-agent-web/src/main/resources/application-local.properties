# 本地JVM启动模板；.env仍由操作者显式加载，不在源码里存储密钥。
server.address=127.0.0.1
server.port=${STOCK_AGENT_HTTP_PORT:8080}
stock.agent.mysql.enabled=${STOCK_AGENT_MYSQL_ENABLED:false}
stock.agent.mysql.url=${STOCK_AGENT_MYSQL_URL:jdbc:mysql://127.0.0.1:3307/stock_agent}
stock.agent.mysql.user=${STOCK_AGENT_MYSQL_USER:stock}
stock.agent.mysql.password=${STOCK_AGENT_MYSQL_PASSWORD:}
stock.agent.health.require-models=${STOCK_AGENT_REQUIRE_MODELS:false}
