<header>
<h1>知研 · Java A 股研究助手</h1>
<p>高保真 UI 方案，A 股优先，预留美股。所有数字与报告内容均为交互示例，页面尚未连接后端。</p>
<nav aria-label="设计场景"><a href="#chat">研究对话</a><a href="#report">报告与证据</a><a href="#portfolio">组合与跟踪</a><a href="README.md">方案目录</a></nav>
</header>
<main>
<section id="chat"><h2>研究对话与同业比较</h2><p>连续追问、比较表、趋势图、来源和执行过程在同一研究任务中组织。</p><a href="images/01-research-chat.png"><img src="images/01-research-chat.png" alt="白蓝色聊天研究页，显示三家公司的同业比较表、趋势图和追问输入框"></a><small>R1 研究入口；文档与关注操作按对应阶段开放。</small></section>
<section id="report"><h2>深度报告与来源原文</h2><p>事实、假设、待验证项分别呈现；点击引用回到证据页，报告按版本保存。</p><a href="images/02-report-evidence.png"><img loading="lazy" src="images/02-report-evidence.png" alt="深度研究报告左栏与右侧原文证据抽屉，显示引用、高亮和页码"></a><small>R2 文档与研究档案。</small></section>
<section id="portfolio"><h2>组合体检与提醒确认</h2><p>按市值分析持仓，缺行情时明确估值口径；跟踪方案确认后才创建。</p><a href="images/03-portfolio-tracking.png"><img loading="lazy" src="images/03-portfolio-tracking.png" alt="组合持仓表、行业配置、估值覆盖提示与等待用户确认的每周复盘方案"></a><small>R4 组合、R5 跟踪；暂未创建的提醒不会显示为已启用。</small></section>
</main>
</html>
